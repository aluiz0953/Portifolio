    <script>
      // Antes da pintura: tema salvo ou o do sistema, para a página não piscar.
      try {
        var t = localStorage.getItem("tema");
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
